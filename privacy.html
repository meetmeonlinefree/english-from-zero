<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Privacy Policy — English from 0</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fc;color:#172440;font:16px/1.8 Arial,sans-serif}.wrap{max-width:860px;margin:auto;padding:25px}header{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:15px 0 35px}a{color:#0756ef}nav{display:flex;gap:6px}button{border:1px solid #dce4f3;padding:9px 13px;border-radius:9px;background:white;color:#172440;cursor:pointer}.active{background:#0756ef;color:white}article{background:white;border:1px solid #e5eaf3;border-radius:25px;padding:40px}h1{font-size:clamp(28px,5vw,42px);line-height:1.15;letter-spacing:-1px}h2{font-size:20px;margin-top:32px}p{color:#536078}small{color:#69758b}.draft{background:#fff6dd;border-left:4px solid #e4b745;padding:18px;border-radius:8px;color:#705717;font-size:14px}footer{padding:25px 0;font-size:13px;color:#69758b}@media(max-width:550px){.wrap{padding:15px}article{padding:24px}header{font-size:13px}}</style></head><body><div class="wrap"><header><a id="back" href="index.html"></a><nav aria-label="Language"><button data-lang="tg">TJ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button></nav></header><article><small>ENGLISH FROM 0 · NEURONIT</small><h1 id="title"></h1><p id="date"></p><p class="draft" id="draft"></p><div id="sections"></div></article><footer>Англисӣ аз 0 · Английский с 0 · English from 0</footer></div><script>const data={"ru": {"title": "Политика конфиденциальности", "back": "← На главную", "date": "Обновлено: 28 октября 2026", "draft": "Проект политики: перед использованием в Google Play подтвердите контакт разработчика и соответствие фактической сборке приложения, включая SDK и резервное копирование.", "sections": [["1. О приложении", "Эта политика описывает запланированную обработку данных в приложении «Англисӣ аз 0 / Английский с 0 / English from 0» команды Neuronit: видеоуроки, аудиоуроки и обучение с тестами. Она подготовлена по согласованной архитектуре; исходный код выпущенной сборки ещё не проверен."], ["2. Данные на устройстве", "Для работы приложения предусмотрено локальное хранение выбранного языка, позиции видео и аудио, просмотренных участков, завершённых этапов, результатов и количества попыток тестов. Каталоги и загруженные тесты кешируются. Эти данные используются для продолжения обучения и отображения прогресса, а не для рекламного профилирования."], ["3. Сетевые запросы", "Для получения каталогов, тестов, изображений, видео и аудио приложение обращается к адресам, указанным в JSON. В текущей структуре используются raw.githubusercontent.com и i.ytimg.com. При запросе сервер получает IP-адрес и технические сведения соединения, включая запрашиваемый ресурс; он может обрабатывать их по собственной политике. Загрузка обложки YouTube не означает встраивание плеера YouTube."], ["4. Сторонние сервисы", "Политики поставщиков: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub</a> и <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Google</a>. Приложение не управляет сроками хранения технических журналов этих поставщиков. Локальный прогресс по проекту не отправляется в репозиторий GitHub."], ["5. Аккаунты, реклама и разрешения", "Согласованная первая версия не предусматривает регистрацию, оплату, рекламные или аналитические SDK и запись с камеры или микрофона. Доступ к интернету нужен для материалов, а медиасервис и уведомления — для фонового аудио. Перед публикацией необходимо проверить, что фактическая сборка не добавляет другой сбор данных или разрешения."], ["6. Хранение и удаление", "Прогресс хранится в данных приложения до очистки данных или удаления приложения. Удалить локальные данные можно в настройках Android: Приложения → English from 0 → Хранилище → Очистить данные (названия зависят от устройства). Очистка кеша сама по себе не обязательно удаляет прогресс. Если в сборке включено резервное копирование Android, данные могут восстанавливаться; его правила необходимо проверить и отразить в окончательной политике. Сроки хранения журналов сторонних сервисов определяются ими."], ["7. Безопасность", "Материалы запрашиваются по HTTPS. Данные обучения должны храниться в закрытом хранилище приложения. Ни один способ хранения или передачи не даёт абсолютной гарантии защиты."], ["8. Дети", "Приложение предназначено для изучения языка; возрастная аудитория ещё должна быть подтверждена разработчиком. В согласованной версии нет функции отправки имени, контактов или фотографий ребёнка разработчику. Если приложение будет ориентировано на детей, фактические сервисы и обработку данных необходимо проверить до выпуска."], ["9. Изменения", "При изменении функций, поставщиков или обработки данных политика должна обновляться вместе с датой вверху страницы. О существенных изменениях следует сообщать в приложении."], ["10. Связь", "Разработчик: Neuronit. Контакт по вопросам конфиденциальности: требуется добавить подтверждённый email до публикации. Не отправляйте пароли и другие секретные сведения."]]}, "en": {"title": "Privacy Policy", "back": "← Back to home", "date": "Updated: October 28, 2026", "draft": "Draft policy: before using this page in Google Play, confirm the developer contact and the actual app build, including SDKs and backup settings.", "sections": [["1. About the app", "This policy describes the planned data handling of “Англисӣ аз 0 / Английский с 0 / English from 0” by Neuronit: video lessons, audio lessons and quizzes. It is based on the agreed architecture; the released app source has not been reviewed."], ["2. On-device data", "The app is designed to store language preferences, video and audio positions, watched intervals, completed steps, quiz results and attempt counts locally. Catalogs and fetched quizzes are cached. This supports learning continuity and progress, rather than advertising profiles."], ["3. Network requests", "The app requests catalogs, quizzes, images, video and audio from URLs in its JSON content. Current sources include raw.githubusercontent.com and i.ytimg.com. Servers receive your IP address and connection metadata, including the requested resource, and may process these under their own policies. Fetching a YouTube thumbnail does not mean embedding a YouTube player."], ["4. Third-party services", "Provider policies: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub</a> and <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Google</a>. Their technical log retention is outside the app’s control. The design does not upload local learning progress to GitHub."], ["5. Accounts, advertising and permissions", "The agreed first version does not include accounts, payments, advertising or analytics SDKs, camera capture or microphone recording. Internet access loads learning materials; media playback services and notifications support background audio. Verify that the actual build has no additional collection or permissions before publication."], ["6. Retention and deletion", "Progress remains in app storage until app data is cleared or the app is uninstalled. To remove it, use Android Settings → Apps → English from 0 → Storage → Clear data; labels vary by device. Clearing cache alone may not remove progress. If Android backup is enabled, data may be restored; verify and document backup rules in the final policy. Third-party providers set their own technical log retention."], ["7. Security", "Content requests use HTTPS. Learning records should remain in private app storage. No transmission or storage method guarantees absolute security."], ["8. Children", "The developer must still confirm the intended age audience. The agreed version has no feature for sending a child’s name, contacts or photographs to the developer. If the app targets children, review actual services and data handling before release."], ["9. Changes", "Update this policy and its date whenever features, providers or data practices change. Material changes should also be communicated in the app."], ["10. Contact", "Developer: Neuronit. Privacy contact: a verified email must be added before publication. Do not send passwords or other secrets."]]}, "tg": {"title": "Сиёсати махфият", "back": "← Ба саҳифаи асосӣ", "date": "Навсозӣ: 28 октябри 2026", "draft": "Лоиҳаи сиёсат: пеш аз истифода дар Google Play тамоси таҳиягар ва кори воқеии барнома, аз ҷумла SDK ва нусхабардории эҳтиётиро тасдиқ кунед.", "sections": [["1. Дар бораи барнома", "Ин сиёсат коркарди пешбинишудаи маълумотро дар барномаи «Англисӣ аз 0 / Английский с 0 / English from 0»-и Neuronit шарҳ медиҳад: видеодарсҳо, аудиодарсҳо ва санҷишҳо. Матн аз рӯи сохтори мувофиқашуда таҳия шудааст; рамзи версияи нашршуда ҳанӯз санҷида нашудааст."], ["2. Маълумот дар дастгоҳ", "Барнома бояд забони интихобшуда, мавқеи видео ва аудио, қисмҳои тамошошуда, марҳилаҳои анҷомёфта, натиҷаҳо ва шумораи кӯшишҳои санҷишро дар дастгоҳ нигоҳ дорад. Феҳристҳо ва санҷишҳои гирифташуда кеш мешаванд. Ин барои идомаи омӯзиш аст, на барои профили таблиғотӣ."], ["3. Дархостҳои шабакавӣ", "Барнома маводро аз суроғаҳои JSON мегирад. Манбаъҳои ҷорӣ raw.githubusercontent.com ва i.ytimg.com мебошанд. Серверҳо IP-суроға ва маълумоти техникии пайвастшавӣ, аз ҷумла маводи дархостшударо мегиранд ва метавонанд мувофиқи сиёсати худ коркард кунанд. Гирифтани тасвири YouTube маънои истифодаи плеери YouTube-ро надорад."], ["4. Хидматҳои беруна", "Сиёсатҳои таъминкунандагон: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub</a> ва <a href=\"https://policies.google.com/privacy\" target=\"_blank\" rel=\"noopener noreferrer\">Google</a>. Муҳлати нигоҳдории сабтҳои техникии онҳо аз ҷониби онҳо муайян мешавад. Тибқи лоиҳа пешрафти маҳаллӣ ба GitHub фиристода намешавад."], ["5. Ҳисобҳо, таблиғ ва иҷозатҳо", "Дар версияи мувофиқашуда сабти ҳисоб, пардохт, SDK-и таблиғ ё таҳлил ва сабти камера ё микрофон пешбинӣ нашудааст. Интернет барои мавод ва хидмати медиаву огоҳиномаҳо барои аудиои заминавӣ лозиманд. Пеш аз нашр иҷозатҳо ва ҷамъоварии маълумотро дар версияи воқеӣ санҷед."], ["6. Нигоҳдорӣ ва несткунӣ", "Пешрафт то пок кардани маълумот ё нест кардани барнома нигоҳ дошта мешавад. Дар Android: Танзимот → Барномаҳо → English from 0 → Ҳофиза → Пок кардани маълумот. Номи қисмҳо метавонад фарқ кунад. Пок кардани кеш на ҳамеша пешрафтро нест мекунад. Агар нусхаи эҳтиётии Android фаъол бошад, маълумот метавонад барқарор шавад; қоидаҳои онро дар сиёсати ниҳоӣ муайян кунед. Хидматҳои беруна муҳлати сабтҳои худро муайян мекунанд."], ["7. Амният", "Дархостҳои мавод HTTPS-ро истифода мебаранд. Маълумоти омӯзиш бояд дар ҳофизаи хусусии барнома нигоҳ дошта шавад. Ҳеҷ усул амнияти мутлақро кафолат намедиҳад."], ["8. Кӯдакон", "Гурӯҳи синнусолиро таҳиягар бояд тасдиқ кунад. Дар версияи мувофиқашуда фиристодани ном, тамос ё акси кӯдак ба таҳиягар пешбинӣ нашудааст. Агар барнома барои кӯдакон бошад, коркарди маълумот ва хидматҳоро пеш аз нашр санҷед."], ["9. Тағйирот", "Ҳангоми тағйири имкониятҳо, таъминкунандагон ё коркарди маълумот ин сиёсат ва санаи он нав карда мешаванд. Дар бораи тағйироти муҳим дар барнома хабар додан лозим аст."], ["10. Тамос", "Таҳиягар: Neuronit. Барои масъалаҳои махфият: пеш аз нашр email-и тасдиқшуда илова карда шавад. Рамзҳо ва маълумоти махфиро нафиристед."]]}};function render(lang){lang=data[lang]?lang:'ru';const d=data[lang];document.documentElement.lang=lang;document.title=d.title+' — English from 0';for(const key of ['title','back','date','draft'])document.getElementById(key).textContent=d[key];document.getElementById('sections').innerHTML=d.sections.map(([h,p])=>'<section><h2>'+h+'</h2><p>'+p+'</p></section>').join('');document.querySelectorAll('[data-lang]').forEach(b=>{b.classList.toggle('active',b.dataset.lang===lang);b.setAttribute('aria-pressed',String(b.dataset.lang===lang))});try{localStorage.setItem('efz-language',lang)}catch{}}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>render(b.dataset.lang));try{render(localStorage.getItem('efz-language')||'ru')}catch{render('ru')}</script></body></html>
